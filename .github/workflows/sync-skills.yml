name: Sync Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/marketplace.json'

jobs:
  sync:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sync skills
        run: node .github/scripts/sync-skills.js

      - name: Verify generated manifests are committed via reviewed PR
        run: |
          git diff --exit-code -- .claude-plugin/marketplace.json .claude-plugin/plugin.json README.md
