name: Validate Agent Skills and WOC Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "woc/**"
      - ".github/workflows/validate-skill.yml"

permissions:
  contents: read

concurrency:
  group: validate-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-metadata:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check skill frontmatter without running third-party code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("skills").glob("*/SKILL.md"))
          assert files, "No skills found"
          failures = []
          for p in files:
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---\n") or "\n---" not in text[4:]:
                  failures.append(f"{p}: missing YAML frontmatter")
                  continue
              frontmatter = text.split("---", 2)[1]
              if not any(line.startswith("name:") for line in frontmatter.splitlines()):
                  failures.append(f"{p}: missing name")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Checked {len(files)} SKILL.md files")
          PY

  woc-tests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline WOC commercial gate tests
        run: node --test woc/tests/*.test.mjs
      - name: Check JavaScript syntax
        run: node --check woc/check.mjs
