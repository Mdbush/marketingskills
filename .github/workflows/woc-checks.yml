name: WOC tools checks
on:
  push:
    paths: ['woc/**', 'tools/clis/**', '.github/workflows/woc-checks.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: WOC Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test woc/tests/*.test.mjs
      - run: node --check woc/check.mjs
      - name: Check marketing CLI syntax without making API requests
        run: |
          for file in tools/clis/*.js; do
            node --check "$file"
          done
